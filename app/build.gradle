plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// Load release signing credentials from keystore.properties (kept out of version control).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.cilpl.Cynergytx_admin'
    compileSdk 35

    // Legacy Apache HTTP (httpmime/httpcore are used); needed so R8 resolves android.net.http.
    useLibrary 'org.apache.http.legacy'

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.cilpl.Cynergytx_admin"
        minSdk 26
        targetSdk 35
        // versionCode scheme: M YY MM DD B S
        //   M  = major (matches versionName's first digit)   -> 1
        //   YY = year   (2026)                               -> 26
        //   MM = month                                       -> 08
        //   DD = date                                        -> 12
        //   B  = build number for that date (increments)     -> 1
        //   S  = stage (5 = staging, 9 = production)          -> 5
        versionCode 126102615
        versionName "1.0.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled true          // R8 code shrinking + optimization
            shrinkResources true        // remove unused resources (dynamic ones kept via res/raw/keep.xml)
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
android {
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/NOTICE.md',
                    'META-INF/LICENSE.md'
            ]
        }
    }
}
dependencies {

    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:app-update:2.1.0'
    // For Kotlin users also add the Kotlin extensions library for Play In-App Update:
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
//    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
//    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'
    implementation 'com.google.firebase:firebase-messaging:24.0.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.media3:media3-common:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests: the copy inside android.jar is a stub that throws,
    // so the status-response parser could not otherwise be tested. Test scope only -- this
    // does not enter the APK.
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'


//lib
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.github.markushi:circlebutton:1.1'
    //noinspection GradleCompatible
    implementation 'org.apache.commons:commons-io:1.3.2'

    implementation 'com.nineoldandroids:library:2.4.0'
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.7.2'
    implementation('org.apache.httpcomponents:httpmime:4.5.6') {
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
    }
    implementation('org.apache.httpcomponents:httpcore:4.4.16') {
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
    }
    //noinspection GradleCompatible
    implementation 'androidx.cardview:cardview:1.0.0'
    //noinspection GradleCompatible
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    //sdps
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
//image slider
    implementation 'com.github.denzcoskun:ImageSlideshow:0.1.2'

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation platform('com.google.firebase:firebase-bom:33.6.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.alimuzaffar.lib:pinentryedittext:1.3.10'
    implementation 'com.github.ibrahimsn98:CirclesLoadingView:1.0'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.github.MoeidHeidari:banner:1.04'

    implementation 'com.github.dangiashish:Auto-Image-Slider:1.0.6'

    implementation 'com.makeramen:roundedimageview:2.3.0'
